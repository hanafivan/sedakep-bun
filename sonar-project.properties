# =========================
# BASIC PROJECT INFO
# =========================
sonar.projectKey=sedakep-app
sonar.projectName=SEDAKEP App
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# =========================
# SOURCE CODE
# =========================
sonar.sources=api,web/src
sonar.inclusions=**/*.ts,**/*.tsx,**/*.js,**/*.jsx

# =========================
# EXCLUSIONS
# =========================
sonar.exclusions=\
node_modules/**,\
web/dist/**,\
storage/**,\
tests/**,\
assets/**,\
.git/**,\
.claude/**,\
.gemini/**,\
.vscode/**

# =========================
# PERFORMANCE
# =========================
sonar.scm.disabled=true
